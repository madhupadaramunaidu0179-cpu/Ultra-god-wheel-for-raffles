<!DOCTYPE html>
<html>
<head>
<title>Ultra God Wheel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background:#000;
  color:white;
  text-align:center;
  font-family:Arial;
}

h1{color:gold;text-shadow:0 0 20px gold;}

canvas{
  background:white;
  border-radius:50%;
  box-shadow:0 0 50px cyan;
}

.pointer{
  font-size:30px;
}

input{padding:6px;margin:4px;}
button{padding:8px 12px;margin:4px;cursor:pointer;}

.spin{background:lime;}
.add{background:blue;color:white;}
.reset{background:red;color:white;}

#winnerScreen{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.95);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transform:scale(0);transition:.4s;
}

.show{transform:scale(1);}

#winnerName{font-size:45px;color:gold;}

#history{
  max-height:120px;
  overflow:auto;
  margin-top:10px;
  font-size:14px;
}
</style>
</head>

<body>

<h1>🎡 ULTRA GOD WHEEL</h1>

<div class="pointer">⬇️</div>
<canvas id="wheel" width="350" height="350"></canvas>

<div>
<input id="name" placeholder="Name">
<input id="weight" placeholder="Number">
<input id="img" placeholder="Image URL (optional)">
<button class="add" onclick="addEntry()">Add</button>
<button class="reset" onclick="reset()">Reset</button>
</div>

<button class="spin" onclick="spin()">SPIN</button>

<div id="history"></div>

<div id="winnerScreen">
  <div>🏆 WINNER</div>
  <div id="winnerName"></div>
</div>

<script>
let entries = JSON.parse(localStorage.getItem("ultraEntries")) || [];
let history = JSON.parse(localStorage.getItem("history")) || [];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let angle=0, spinning=false;

function drawWheel(){
 if(entries.length==0)return;

 let total=entries.reduce((s,e)=>s+e.weight,0);
 let start=angle;

 entries.forEach((e,i)=>{
  let slice=(e.weight/total)*2*Math.PI;

  ctx.beginPath();
  ctx.fillStyle=`hsl(${i*60},70%,50%)`;
  ctx.moveTo(175,175);
  ctx.arc(175,175,175,start,start+slice);
  ctx.fill();

  ctx.save();
  ctx.translate(175,175);
  ctx.rotate(start+slice/2);

  ctx.fillStyle="white";
  ctx.fillText(e.name,90,-5);

  ctx.fillStyle="yellow";
  ctx.fillText(e.weight,90,15);

  // profile image
  if(e.img){
    let img=new Image();
    img.src=e.img;
    ctx.drawImage(img,80,-40,30,30);
  }

  ctx.restore();
  start+=slice;
 });
}

function spin(){
 if(spinning||entries.length==0)return;
 spinning=true;

 let vel=Math.random()*0.5+0.4;

 function animate(){
  vel*=0.985;
  angle+=vel;

  ctx.clearRect(0,0,350,350);
  drawWheel();

  if(vel>0.002){
    requestAnimationFrame(animate);
  }else{
    spinning=false;
    pickWinner();
  }
 }
 animate();
}

function pickWinner(){
 let total=entries.reduce((s,e)=>s+e.weight,0);
 let rand=Math.random()*total;

 let cum=0;
 for(let i=0;i<entries.length;i++){
  cum+=entries[i].weight;
  if(rand<=cum){

    let win=entries[i];

    document.getElementById("winnerName").innerText=
      win.name+" ("+win.weight+")";

    document.getElementById("winnerScreen").classList.add("show");

    // remove winner
    entries.splice(i,1);

    // history
    history.push(win.name);
    document.getElementById("history").innerHTML=
      "Winners: "+history.join(", ");

    save();

    setTimeout(()=>winnerScreen.classList.remove("show"),4000);
    break;
  }
 }
}

function addEntry(){
 let name=nameInput.value;
 let weight=parseFloat(weightInput.value);
 let img=img.value;

 if(name && weight>0){
  entries.push({name,weight,img});
  save();
 }
}

function reset(){
 entries=[];
 history=[];
 save();
}

function save(){
 localStorage.setItem("ultraEntries",JSON.stringify(entries));
 localStorage.setItem("history",JSON.stringify(history));
 redraw();
}

function redraw(){
 ctx.clearRect(0,0,350,350);
 drawWheel();
}

redraw();
</script>

</body>
</html>
