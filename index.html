<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Wheel Pro</title>

<style>
body{
  margin:0;
  background: radial-gradient(circle,#020617,#000);
  color:white;
  font-family:Arial;
  text-align:center;
}

h1{
  color:gold;
  text-shadow:0 0 20px gold;
}

.container{
  max-width:400px;
  margin:auto;
}

canvas{
  background:white;
  border-radius:50%;
  box-shadow:0 0 40px cyan;
}

.pointer{
  font-size:28px;
  margin-top:10px;
}

input{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
  width:40%;
}

button{
  padding:10px 15px;
  margin:5px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.spin{background:lime;}
.add{background:dodgerblue;color:white;}
.reset{background:crimson;color:white;}

#winnerScreen{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.95);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transform:scale(0);
  transition:0.4s;
}

.show{transform:scale(1);}

#winnerName{
  font-size:45px;
  color:gold;
  text-shadow:0 0 30px gold;
}
</style>
</head>

<body>

<h1>🎡 Ultra Wheel Pro</h1>

<div class="container">
<div class="pointer">⬇️</div>
<canvas id="wheel" width="320" height="320"></canvas>

<div>
<input id="name" placeholder="Name">
<input id="weight" placeholder="Number">
</div>

<div>
<button class="add" onclick="addEntry()">Add</button>
<button class="reset" onclick="reset()">Reset</button>
</div>

<button class="spin" onclick="spin()">SPIN</button>
</div>

<div id="winnerScreen">
  <div>🏆 WINNER</div>
  <div id="winnerName"></div>
</div>

<audio id="tick" src="https://www.soundjay.com/mechanical/sounds/tick-01.mp3"></audio>
<audio id="win" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<script>
let entries = JSON.parse(localStorage.getItem("entries")) || [];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let angle=0;
let spinning=false;

function drawWheel(){
 if(entries.length===0)return;

 let total=entries.reduce((s,e)=>s+e.weight,0);
 let start=angle;

 entries.forEach((e,i)=>{
  let slice=(e.weight/total)*2*Math.PI;

  ctx.beginPath();
  ctx.fillStyle=`hsl(${i*60},70%,50%)`;
  ctx.moveTo(160,160);
  ctx.arc(160,160,160,start,start+slice);
  ctx.fill();

  // show text only if slice big
  if(slice>0.2){
    ctx.save();
    ctx.translate(160,160);
    ctx.rotate(start+slice/2);

    ctx.fillStyle="white";
    ctx.fillText(e.name,80,-5);

    ctx.fillStyle="yellow";
    ctx.fillText(e.weight,80,15);

    ctx.restore();
  }

  start+=slice;
 });
}

function spin(){
 if(spinning||entries.length===0)return;
 spinning=true;

 let velocity=0.5;
 let slowDownStart=200;

 function animate(){
  velocity*=0.985;
  angle+=velocity;

  // suspense slowdown
  if(velocity<0.1){
    document.getElementById("tick").currentTime=0;
    document.getElementById("tick").play();
  }

  ctx.clearRect(0,0,320,320);
  drawWheel();

  if(velocity>0.002){
    requestAnimationFrame(animate);
  }else{
    spinning=false;
    pickWinner();
  }
 }

 animate();
}

function pickWinner(){
 let total=entries.reduce((s,e)=>s+e.weight,0);
 let rand=Math.random()*total;

 let cum=0;
 for(let i=0;i<entries.length;i++){
  cum+=entries[i].weight;
  if(rand<=cum){

    let win=entries[i];

    document.getElementById("winnerName").innerText =
      win.name+" ("+win.weight+")";

    document.getElementById("winnerScreen").classList.add("show");
    document.getElementById("win").play();

    setTimeout(()=>{
      document.getElementById("winnerScreen").classList.remove("show");
    },4000);

    break;
  }
 }
}

function addEntry(){
 let name=nameInput.value;
 let weight=parseFloat(weightInput.value);

 if(name && weight>0){
  entries.push({name,weight});
  nameInput.value="";
  weightInput.value="";
  save();
 }
}

function reset(){
 entries=[];
 save();
}

function save(){
 localStorage.setItem("entries",JSON.stringify(entries));
 redraw();
}

function redraw(){
 ctx.clearRect(0,0,320,320);
 drawWheel();
}

redraw();
</script>

</body>
</html>
