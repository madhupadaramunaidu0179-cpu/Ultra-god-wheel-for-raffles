<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Wheel</title>

<style>
body{
  margin:0;
  background:black;
  color:white;
  text-align:center;
  font-family:Arial;
}

h1{
  color:cyan;
  text-shadow:0 0 20px cyan;
}

canvas{
  border-radius:50%;
  background:#111;
  box-shadow:0 0 50px cyan;
}

.pointer{
  font-size:35px;
  color:red;
  text-shadow:0 0 10px red;
}

input{
  padding:8px;
  margin:5px;
  border:none;
  border-radius:6px;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:active{
  transform:scale(0.95);
}

.spin{background:lime;}
.add{background:dodgerblue;color:white;}
.reset{background:red;color:white;}

#winnerBox{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  font-size:40px;
  color:gold;
  text-shadow:0 0 30px gold;
  transition:0.4s;
}

.show{
  transform:translate(-50%,-50%) scale(1.2);
}
</style>
</head>

<body>

<h1>🎡 Ultimate Wheel</h1>
<div class="pointer">⬇️</div>

<canvas id="wheel" width="320" height="320"></canvas>

<div>
<input id="name" placeholder="Name">
<input id="weight" placeholder="Number">
<button class="add" onclick="addEntry()">Add</button>
<button class="reset" onclick="reset()">Reset</button>
</div>

<button class="spin" onclick="spin()">SPIN</button>

<div id="winnerBox"></div>

<audio id="tick" src="https://www.soundjay.com/mechanical/sounds/tick-01.mp3"></audio>

<script>
let entries=[];
let angle=0;
let velocity=0;
let spinning=false;
let lastSlice=-1;

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

function drawWheel(){
 if(entries.length===0)return;

 let total=entries.reduce((s,e)=>s+e.weight,0);
 let start=angle;

 entries.forEach((e,i)=>{
  let slice=(e.weight/total)*2*Math.PI;

  ctx.beginPath();
  ctx.fillStyle=`hsl(${i*60},80%,50%)`;
  ctx.moveTo(160,160);
  ctx.arc(160,160,160,start,start+slice);
  ctx.fill();

  if(slice>0.3){
    ctx.save();
    ctx.translate(160,160);
    ctx.rotate(start+slice/2);

    ctx.fillStyle="white";
    ctx.font="bold 12px Arial";
    ctx.fillText(e.name,80,-5);

    ctx.fillStyle="yellow";
    ctx.font="10px Arial";
    ctx.fillText(e.weight,80,12);

    ctx.restore();
  }

  start+=slice;
 });
}

function getWinner(){
 let total=entries.reduce((s,e)=>s+e.weight,0);

 let pointer=(Math.PI*1.5 - angle)%(2*Math.PI);
 if(pointer<0) pointer+=2*Math.PI;

 let current=0;

 for(let e of entries){
  let slice=(e.weight/total)*2*Math.PI;
  current+=slice;
  if(pointer<=current){
    return e;
  }
 }
}

function updateTick(){
 let currentSlice=Math.floor((angle%(2*Math.PI))*10);

 if(currentSlice!==lastSlice){
  lastSlice=currentSlice;
  let t=document.getElementById("tick");
  t.currentTime=0;
  t.play();
 }
}

function spin(){
 if(spinning || entries.length===0)return;
 spinning=true;

 velocity=Math.random()*0.4+0.35;

 function animate(){
  velocity*=0.982;

  if(velocity<0.08){
    velocity*=0.96;
  }

  angle+=velocity;

  updateTick();

  ctx.clearRect(0,0,320,320);
  drawWheel();

  if(velocity>0.002){
    requestAnimationFrame(animate);
  }else{
    finalStop();
  }
 }

 animate();
}

function finalStop(){
 angle+=0.02;

 setTimeout(()=>{
  let win=getWinner();
  showWinner(win);
  spinning=false;
 },200);
}

function showWinner(win){
 let box=document.getElementById("winnerBox");
 box.innerText=win.name+" ("+win.weight+")";
 box.classList.add("show");

 setTimeout(()=>{
  box.classList.remove("show");
 },3000);
}

function addEntry(){
 let n=name.value;
 let w=parseFloat(weight.value);

 if(n && w>0){
  entries.push({name:n,weight:w});
  name.value="";
  weight.value="";
 }
}

function reset(){
 entries=[];
 ctx.clearRect(0,0,320,320);
}
</script>

</body>
</html>
